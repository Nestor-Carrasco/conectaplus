name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm', cache-dependency-path: 'pnpm-lock.yaml' }
      - run: pnpm install --frozen-lockfile
      - name: Audit producción (gate)
        run: pnpm audit --prod
      # Gate obligatorio: cualquier advisory high/critical rompe el build.
      # Sin excepciones vigentes (ver AGENTS.md).
      - name: Audit high+critical (gate)
        run: pnpm audit --audit-level=high
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
